stages: 
  - build
  - test

variables:
  PROJECT_NAME: "vprofile" 

  #build stage

build_job:
    stage: build
    image: maven:3.9.9-eclipse-temurin-17
    only:
      - main
    script:
      - echo "Building the project..."
      - mvn install 

#test stage
test_job:
    stage: test
    image: maven:3.9.9-eclipse-temurin-17
    only:
      - main
    script:
      - echo "Running unit tests..."
      - mvn test
      - mvn checkstyle:checkstyle
       